spring.application.name=leetcode-ted-notification
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# AWS SQS (populated via env vars)
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# App
app.sqs.queue-url=${SQS_QUEUE_URL:}
app.notifications.enabled=${ENABLE_SQS_NOTIFICATIONS:false}
app.leetcode.stats-api=https://leetcode-stats.tashif.codes
app.solve-poll.interval-ms=${SOLVE_POLL_INTERVAL_MS:10000}

# Scheduling
spring.task.scheduling.enabled=true
